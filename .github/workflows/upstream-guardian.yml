name: Upstream Guardian

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  guardian:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir vendor/deepseek-harness install --frozen-lockfile
        env:
          CI: true
      - name: Checkout Harness master candidate
        run: |
          git -C vendor/deepseek-harness fetch origin master --depth=1
          git -C vendor/deepseek-harness checkout FETCH_HEAD
      - name: Run compatibility guardian
        run: pnpm guardian -- --promote
      - name: Publish candidate update PR
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          candidate_sha=$(git -C vendor/deepseek-harness rev-parse HEAD)
          branch="guardian/${candidate_sha}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add vendor/deepseek-harness packages/desktop-host/src/upstream.ts
          git commit -m "chore: test DeepSeek Harness ${candidate_sha}" || exit 0
          git push --set-upstream origin "$branch"
          gh pr create --base main --head "$branch" --title "chore: update tested Harness ${candidate_sha}" --body "Generated by the daily Upstream Guardian after the Phase 1 compatibility and Web smoke suite passed."
