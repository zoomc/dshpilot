name: Upstream Guardian

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  guardian:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir vendor/deepseek-harness install --frozen-lockfile
        env:
          CI: true
      - name: Run candidate compatibility guardian
        id: guardian
        continue-on-error: true
        run: set -o pipefail; pnpm guardian -- --promote 2>&1 | tee guardian.log
      - name: Publish guardian diagnostics
        if: always()
        run: cat guardian.log >> "$GITHUB_STEP_SUMMARY"
      - name: Open or update failure issue
        if: steps.guardian.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "Upstream Guardian failure ($GITHUB_RUN_ID)" \
            --body "The daily Harness compatibility guardian failed. See the workflow summary and guardian.log artifact."
      - name: Upload guardian log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upstream-guardian-${{ github.run_id }}
          path: |
            guardian.log
            artifacts/guardian
          if-no-files-found: ignore
      - name: Create candidate update PR
        if: steps.guardian.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet --submodule=diff; then
            echo "No upstream change to propose."
            exit 0
          fi
          branch="upstream-guardian-${GITHUB_RUN_ID}"
          git switch -c "$branch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vendor/deepseek-harness packages/desktop-host/src/upstream.ts
          git commit -m "chore: promote tested Harness upstream candidate"
          git push --set-upstream origin "$branch"
          gh pr create \
            --base main \
            --head "$branch" \
            --title "chore: promote tested Harness upstream candidate" \
            --body "Generated by the Upstream Guardian after build, typecheck, unit, Web smoke, plugin loading, and runtime bundle checks passed."
