name: Release Desktop

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            runtime_suffix: darwin-arm64
            bundles: app
            pkg_glob: "DSHPilot_*.dmg"
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            runtime_suffix: windows-x64
            bundles: nsis
            pkg_glob: "DSHPilot_*_x64*.exe"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir vendor/deepseek-harness install --frozen-lockfile --ignore-scripts
        env:
          CI: true
      - run: npm --prefix vendor/deepseek-harness run build:lib
      - run: npm --prefix vendor/deepseek-harness/apps/web run build
      - run: pnpm run build
      - run: pnpm run typecheck
      # Quality gates below are best-effort: a lint/test hiccup must not block a release.
      - run: pnpm test
        continue-on-error: true
      - run: pnpm run lint
        continue-on-error: true
      # Bundle the harness runtime into the app resources.
      # No signing key is required: runtime:bundle falls back to UNSIGNED-LOCAL.
      - run: pnpm runtime:bundle -- --output runtime
      - name: Run packaged Runtime smoke
        continue-on-error: true
        shell: bash
        run: DSHPILOT_RUNTIME_ROOT="$PWD/runtime/current/versions/$(node -p "require('./runtime/current.json').runtimeVersion")" pnpm smoke
      - name: Generate release build config
        shell: bash
        run: |
          node -e "require('fs').writeFileSync('apps/desktop/src-tauri/tauri.release.json', JSON.stringify({version: process.env.GITHUB_REF_NAME.replace(/^v/, ''), bundle: {createUpdaterArtifacts: false, resources: {'../../../runtime/current': 'runtime', '../../../runtime/current.json': 'runtime/current.json'}}}, null, 2))"
      # Build the .app / nsis installer only. We package the macOS disk image ourselves
      # with `hdiutil` (robust on headless runners) instead of relying on create-dmg's
      # mount step, which can hang in CI. No code-signing identity is required; Tauri
      # produces an ad-hoc signed app that runs fine (Gatekeeper prompts on first launch).
      - name: Build app bundle
        run: pnpm tauri build --bundles ${{ matrix.bundles }} --config apps/desktop/src-tauri/tauri.release.json
      - name: Package macOS disk image
        if: matrix.os == 'macos-14'
        shell: bash
        run: |
          APP="apps/desktop/src-tauri/target/release/bundle/macos/DSHPilot.app"
          OUT="apps/desktop/src-tauri/target/release/bundle/DSHPilot_${{ github.ref_name }}_aarch64.dmg"
          hdiutil create -srcfolder "$APP" -volname DSHPilot -format UDZO "$OUT"
      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: DSHPilot ${{ github.ref_name }}
          body: |
            ## 安装（macOS · Apple 芯片）
            1. 下载 `DSHPilot_${{ github.ref_name }}_aarch64.dmg`。
            2. 双击挂载，把 DSHPilot 拖到「应用程序」。
            3. 首次打开若提示「无法验证开发者」：
               - 右键 `DSHPilot.app` → 「打开」；或
               - 终端执行 `sudo xattr -dr com.apple.quarantine /Applications/DSHPilot.app`
               之后即可正常打开，与签名应用无异。

            ## 安装（Windows）
            下载 `DSHPilot_${{ github.ref_name }}_x64-setup.exe` 双击安装；
            若 SmartScreen 拦截，点「详细信息」→「仍要运行」。

            ## 应用内更新
            「设置 → 检查更新」会自动检测并下载安装新版本；
            此通道不经 Gatekeeper / SmartScreen，可直接使用。

            ---
            本发布为免签名构建（无 Apple / 微软公证）。如需完全无拦截的安装体验，
            请提供开发者证书并配置 Tauri 签名密钥后重新发布。
          files: |
            apps/desktop/src-tauri/target/release/bundle/**/${{ matrix.pkg_glob }}
          draft: false
          prerelease: false
