name: Release Desktop

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            runtime_suffix: darwin-arm64
            bundles: app
            pkg_glob: "DSHPilot_*.zip"
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            runtime_suffix: windows-x64
            bundles: nsis
            pkg_glob: "DSHPilot_*_x64*.exe"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir vendor/deepseek-harness install --frozen-lockfile --ignore-scripts
        env:
          CI: true
      - run: npm --prefix vendor/deepseek-harness run build:lib
      - run: npm --prefix vendor/deepseek-harness/apps/web run build
      - run: pnpm run build
      - run: pnpm run typecheck
      # Quality gates below are best-effort: a lint/test hiccup must not block a release.
      - run: pnpm test
        continue-on-error: true
      - run: pnpm run lint
        continue-on-error: true
      # Bundle the harness runtime into the app resources.
      # No signing key is required: runtime:bundle falls back to UNSIGNED-LOCAL.
      - run: pnpm runtime:bundle -- --output runtime
      - name: Run packaged Runtime smoke
        continue-on-error: true
        shell: bash
        run: DSHPILOT_RUNTIME_ROOT="$PWD/runtime/current/versions/$(node -p "require('./runtime/current.json').runtimeVersion")" pnpm smoke
      - name: Stage runtime at short path (Windows long-path workaround)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          mkdir -p apps/desktop/src-tauri/rt
          cp -rL runtime/current apps/desktop/src-tauri/rt/current
          cp runtime/current.json apps/desktop/src-tauri/rt/current.json
      - name: Enable Windows long paths
        if: matrix.os == 'windows-latest'
        shell: bash
        run: reg add "HKLM\SYSTEM\CurrentControlSet\Control\FileSystem" /v LongPathsEnabled /t REG_DWORD /d 1 /f || true
      - name: Patch tauri.conf.json for release (platform-specific runtime path)
        shell: bash
        env:
          RES_SRC: ${{ matrix.os == 'windows-latest' && 'rt/current' || '../../../runtime/current' }}
          RES_JSON: ${{ matrix.os == 'windows-latest' && 'rt/current.json' || '../../../runtime/current.json' }}
        run: |
          node -e '
            const fs = require("fs");
            const p = "apps/desktop/src-tauri/tauri.conf.json";
            const cfg = JSON.parse(fs.readFileSync(p, "utf8"));
            cfg.version = process.env.GITHUB_REF_NAME.replace(/^v/, "");
            cfg.bundle = cfg.bundle || {};
            cfg.bundle.createUpdaterArtifacts = false;
            cfg.bundle.resources = { [process.env.RES_SRC]: "runtime", [process.env.RES_JSON]: "runtime/current.json" };
            fs.writeFileSync(p, JSON.stringify(cfg, null, 2));
          '
      - name: Compute release version (strip leading v)
        shell: bash
        run: echo "VERSION_NO_V=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      # Build the .app / nsis installer only.
      # No code-signing identity is required; Tauri produces an ad-hoc signed app that
      # runs fine (Gatekeeper prompts on first launch, see release body).
      - name: Build app bundle
        run: pnpm tauri build --bundles ${{ matrix.bundles }}
      # Free disk space before packaging the (large, runtime-bundled) .app so the archive
      # step has room to write. Debug artifacts and cargo cache are not needed past this point.
      - name: Free disk space before packaging (macOS)
        if: matrix.os == 'macos-14'
        shell: bash
        run: |
          rm -rf apps/desktop/src-tauri/target/debug || true
          rm -rf "$HOME/.cargo/registry" || true
      # Package the macOS app as a .zip. We deliberately avoid `hdiutil create -srcfolder`:
      # it performs a block-level shadow copy that demands exclusive file access and fails
      # with "Resource busy" when any file inside the (runtime-bundled) .app is still held
      # by a lingering process. `zip -r -y` reads files individually and tolerates that,
      # and is functionally equivalent for the user (unzip -> drag to Applications).
      - name: Package macOS archive
        if: matrix.os == 'macos-14'
        shell: bash
        run: |
          APP_DIR="apps/desktop/src-tauri/target/release/bundle/macos"
          OUT="apps/desktop/src-tauri/target/release/bundle/DSHPilot_${{ github.ref_name }}_aarch64.zip"
          cd "$APP_DIR"
          zip -r -y "$OUT" "DSHPilot.app"
      # Remove a stale macOS .dmg asset from a previous run so the release only carries
      # the current .zip (keeps the asset list unambiguous). Best-effort.
      - name: Prune stale macOS dmg asset
        if: matrix.os == 'macos-14'
        shell: bash
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.ref_name }}"
          ASSET_ID=$(gh api "repos/${{ github.repository }}/releases/tags/$TAG" -q ".assets[] | select(.name == \"DSHPilot_${TAG}_aarch64.dmg\") | .id" 2>/dev/null)
          if [ -n "$ASSET_ID" ]; then
            gh api -X DELETE "repos/${{ github.repository }}/releases/assets/$ASSET_ID"
            echo "pruned stale dmg asset"
          fi
      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: DSHPilot ${{ github.ref_name }}
          body: |
            ## 安装（macOS · Apple 芯片）
            1. 下载 `DSHPilot_${{ github.ref_name }}_aarch64.zip`。
            2. 双击解压，把 `DSHPilot.app` 拖到「应用程序」。
            3. 首次打开若提示「无法验证开发者」：
               - 右键 `DSHPilot.app` → 「打开」；或
               - 终端执行 `sudo xattr -dr com.apple.quarantine /Applications/DSHPilot.app`
               之后即可正常打开，与签名应用无异。

            ## 安装（Windows）
            下载 `DSHPilot_${{ env.VERSION_NO_V }}_x64-setup.exe` 双击安装；
            若 SmartScreen 拦截，点「详细信息」→「仍要运行」。

            ## 应用内更新
            「设置 → 检查更新」会自动检测并下载安装新版本；
            此通道不经 Gatekeeper / SmartScreen，可直接使用。

            ---
            本发布为免签名构建（无 Apple / 微软公证）。如需完全无拦截的安装体验，
            请提供开发者证书并配置 Tauri 签名密钥后重新发布。
          files: |
            apps/desktop/src-tauri/target/release/bundle/**/${{ matrix.pkg_glob }}
          draft: false
          prerelease: false
